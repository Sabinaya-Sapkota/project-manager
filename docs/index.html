<!doctype html><html><head><meta charset="utf-8"><title>Project Manager</title>
<script>if(!window.__TAURI__){document.write('<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1218"><script src="vendor/sql-wasm.js"><\/script><script src="web-shim.js"><\/script>')}</script>
<style>
:root{--bg:#0f1218;--panel:#171b24;--card:#212736;--tx:#e6e9f0;--mut:#8b93a7;--acc:#6c8cff;--bd:#2a3142}
:root[data-t=light]{--bg:#f3f4f8;--panel:#fff;--card:#f1f3f9;--tx:#1b2030;--mut:#667;--bd:#dde1ec}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh}
aside{width:240px;background:var(--panel);border-right:1px solid var(--bd);padding:12px;overflow:auto;flex:none}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--bd);align-items:center}
#view{flex:1;overflow:auto;padding:16px}
input,textarea,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical}button{cursor:pointer}button:hover{border-color:var(--acc)}button.p{background:var(--acc);color:#fff;border:0}
button.s{padding:2px 6px;border:0;background:none;color:var(--mut)}
.item{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;align-items:center}.item:hover{background:var(--card)}
h4{margin:14px 0 6px;color:var(--mut);font-size:11px;text-transform:uppercase}
.tb{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.board{display:flex;gap:12px;align-items:flex-start;height:calc(100% - 48px)}
.list{width:280px;flex:none;background:var(--panel);border-radius:10px;padding:8px;max-height:100%;display:flex;flex-direction:column}
.cards{overflow:auto;min-height:24px;display:flex;flex-direction:column;gap:6px;margin:6px 0}
.card{background:var(--card);border-radius:8px;padding:8px;cursor:grab;border:1px solid var(--bd);word-break:break-word}
.dn{opacity:.55;text-decoration:line-through}.due{font-size:11px;color:var(--mut)}.od{color:#ff6b6b}
.pri1{border-left:3px solid #4ade80}.pri2{border-left:3px solid #fbbf24}.pri3{border-left:3px solid #f87171}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}.chip{font-size:10px;padding:1px 6px;border-radius:8px;color:#111;cursor:pointer}.chip.off{opacity:.3}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:10px;width:560px;max-width:95vw;max-height:90vh}
dialog::backdrop{background:#0008}.row{display:flex;gap:8px;margin:8px 0;align-items:center}.row>input,.row>select{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.box{background:var(--panel);border-radius:10px;padding:12px}
.bar{height:4px;background:var(--card);border-radius:2px;margin:0 8px 4px}.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{background:var(--panel);min-height:96px;border-radius:6px;padding:4px;overflow:hidden}.day.o{opacity:.4}.day.t{outline:1px solid var(--acc)}
.ce{font-size:11px;background:var(--card);border-radius:4px;padding:2px 4px;margin-top:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{display:flex;gap:6px;align-items:center;padding:2px 0}.ck input{flex:none}.act{font-size:12px;color:var(--mut);padding:2px 0}
.tr{display:flex;height:28px;align-items:center}.tl{width:190px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;padding-right:8px}.tt{position:relative;height:100%;flex:none}.b2{position:absolute;top:5px;height:18px;border-radius:5px;background:var(--acc);color:#fff;font-size:11px;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:pointer}.b2.dn2{opacity:.4}.b2.ov{background:#ef4444}
.card{user-select:none}.lh{cursor:grab}.ph{border:2px dashed var(--acc);border-radius:8px;opacity:.6;flex:none;box-sizing:border-box}
#ctx{position:fixed;display:none;z-index:10000;min-width:190px;background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:4px;box-shadow:0 10px 30px #0006}
.cm-i{position:relative;padding:6px 10px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:16px;white-space:nowrap}.cm-i:hover{background:var(--card)}.cm-d{color:#ff6b6b}.cm-sep{height:1px;background:var(--bd);margin:4px 2px}
.cm-sub{display:none;position:absolute;left:100%;top:-4px;min-width:170px;background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:4px;box-shadow:0 10px 30px #0006;max-height:60vh;overflow:auto}.cm-i:hover>.cm-sub{display:block}#ctx.flip .cm-sub{left:auto;right:100%}
</style></head><body>
<aside><b style="font-size:16px">⚡ Project Manager</b>
<div class="item" onclick="home()" style="margin-top:10px">🏠 Home <span class="due">h</span></div>
<div class="item" onclick="calendar()">📅 Calendar <span class="due">c</span></div>
<div class="item" onclick="archived()">🗄 Archived cards</div>
<h4>Workspaces</h4><div id="ws"></div><button onclick="newWs()" style="width:100%;margin-top:6px">+ Workspace</button>
<h4>Boards</h4><div id="bd"></div><button onclick="newBoard()" style="width:100%;margin-top:6px">+ Board</button>
<div class="item" onclick="settingsView()" style="margin-top:16px">⚙ Settings</div><div class=due style="margin-top:8px">Tip: right-click cards, lists, boards and workspaces for quick actions.</div><input type="file" id="imp" accept=".json" hidden onchange="doImport(this)"></aside>
<main><header><input id="s" placeholder="Search cards ( / )" style="flex:1" oninput="doSearch(this.value)"><span id="rem" class="due"></span><span id="msg" class="due"></span></header>
<div id="view"></div></main><dialog id="dlg"></dialog><div id="ctx"></div>
<script>
const inv=(c,a)=>window.__TAURI__.core.invoke(c,a);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
let S={ws:null,board:null,view:'home',cal:new Date(),f:{q:'',label:'',pri:0},sort:'manual',set:{},card:null,skip:false};
function toast(t){$('msg').textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>$('msg').textContent='',6000)}
async function run(p){try{return await p}catch(x){toast('⚠ '+x)}}
function setView(v){S.view=v;$('view').style.background='';$('view').scrollTop=0}
function refresh(){({home,board:()=>openBoard(S.board),cal:calendar,settings:settingsView,archived,timeline:()=>timeline(),search:()=>doSearch($('s').value)})[S.view]()}
function openDlg(html,onclose){const d=$('dlg');d.innerHTML=html;d.returnValue='';d.onclose=()=>{if(d.open)return;(onclose||refresh)()};if(!d.open)d.showModal()}
function ask(label,def=''){return new Promise(r=>{const d=$('dlg');d.innerHTML=`<form method="dialog"><b>${label}</b><div class=row><input id=askin value="${esc(def)}"></div><div class=row><button type=button onclick="$('dlg').close('x')">Cancel</button><button class=p value=ok>OK</button></div></form>`;d.returnValue='';d.onclose=()=>{if(d.open)return;r(d.returnValue==='ok'?$('askin').value:null)};d.showModal();$('askin').focus()})}
function formDlg(title,fields,del){return new Promise(r=>{const d=$('dlg');
d.innerHTML=`<form method="dialog"><b>${title}</b>${fields.map(f=>`<div class=row><label style="flex:0 0 80px">${f[1]}</label><input name="${f[0]}" type="${f[2]||'text'}" value="${esc(f[3]??'')}"></div>`).join('')}<div class=row>${del?`<button type=button onclick="$('dlg').close('del')">${del}</button>`:''}<button type=button onclick="$('dlg').close('x')">Cancel</button><button class=p value=ok>Save</button></div></form>`;
d.returnValue='';d.onclose=()=>{if(d.open)return;const v=d.returnValue;if(v==='ok'){const o={};d.querySelectorAll('input').forEach(i=>o[i.name]=i.value);r(o)}else r(v==='del'?'del':null)};d.showModal()})}
// ---------- sidebar / boot
async function boot(){const st=await run(inv('settings'))||[];S.set={};st.forEach(r=>S.set[r.key]=r.value);
document.documentElement.dataset.t=S.set.theme||'dark';if(S.set.accent){document.documentElement.style.setProperty('--acc',S.set.accent)}
await side();home();remind()}
const setSet=(k,v)=>{S.set[k]=v;return run(inv('set_setting',{key:k,value:v}))};
function toggleTheme(){const t=document.documentElement.dataset.t==='light'?'dark':'light';document.documentElement.dataset.t=t;setSet('theme',t)}
function setAccent(v){document.documentElement.style.setProperty('--acc',v);clearTimeout(setAccent.t);setAccent.t=setTimeout(()=>setSet('accent',v),300)}
async function side(){const w=await run(inv('workspaces'))||[];S.wss=w;if(!w.find(x=>x.id==S.ws))S.ws=w.length?w[0].id:null;
$('ws').innerHTML=w.map(x=>`<div class="item" data-ws=${x.id} onclick="S.ws=${x.id};side().then(home)" style="${x.id==S.ws?'background:var(--card)':''}"><span><span style="color:${esc(x.color)}">●</span> ${esc(x.icon)} ${esc(x.name)}</span><button class=s onclick="event.stopPropagation();editWs(${x.id},'${esc(x.name).replace(/'/g,'')}','${esc(x.color)}','${esc(x.icon)}')">✎</button></div>`).join('')||'<div class=due>None yet</div>';
S.boards=S.ws?await run(inv('boards',{ws:S.ws}))||[]:[];
$('bd').innerHTML=S.boards.map(x=>`<div class="item" data-bd=${x.id} onclick="openBoard(${x.id})"><span>${x.fav?'⭐ ':''}${esc(x.name)}</span><span><button class=s title="Duplicate structure" onclick="event.stopPropagation();dupBoard(${x.id})">⧉</button><button class=s onclick="event.stopPropagation();editBoard(${x.id})">✎</button></span></div>`).join('')||'<div class=due>No boards</div>'}
async function newWs(){const o=await formDlg('New workspace',[['name','Name'],['icon','Icon','text','📁'],['color','Colour','color','#6c8cff']]);if(o&&o!=='del'){await run(inv('add_workspace',o));await side();home()}}
async function editWs(id,name,color,icon){const o=await formDlg('Edit workspace',[['name','Name','text',name],['icon','Icon','text',icon],['color','Colour','color',color]],'Delete');
if(o==='del'){if(confirm('Delete workspace with all boards and cards?')){await run(inv('del_workspace',{id}));S.ws=null}}else if(o)await run(inv('edit_workspace',{id,...o}));await side();home()}
async function newBoard(){if(!S.ws)return toast('Create a workspace first');const o=await formDlg('New board',[['name','Name'],['bg','Background','color','#1f2937']]);if(o&&o!=='del'){const id=await run(inv('add_board',{ws:S.ws,...o}));await side();if(id)openBoard(id)}}
async function editBoard(id){const b=S.boards.find(x=>x.id==id);const o=await formDlg('Edit board',[['name','Name','text',b.name],['bg','Background','color',b.bg]],'Delete');
if(o==='del'){if(confirm('Delete board and all its cards?'))await run(inv('del_board',{id}));await side();return home()}if(o)await run(inv('edit_board',{id,...o}));await side();S.board==id?openBoard(id):home()}
async function dupBoard(id){const n=await run(inv('dup_board',{id}));await side();if(n)openBoard(n)}
// ---------- home
const DEF=['overdue','today','upcoming','focus','favs','recentb','milestones','progress','recent','inbox','notes'];
const dash=()=>{let a=[];try{a=JSON.parse(S.set.dash||'[]')}catch{}DEF.forEach(id=>{if(!a.find(x=>x.id==id))a.push({id,on:true})});return a.filter(x=>DEF.includes(x.id))};
const li=a=>a.map(c=>`<div class="item" data-c=${c.id} onclick="editCard(${c.id})"><span>${esc(c.title)}</span><span class="due ${c.due&&c.due<today()?'od':''}">${esc(c.due||c.board)}</span></div>`).join('')||'<div class=due>Nothing here</div>';
const WT={favs:['⭐ Favourite boards',d=>d.favs.map(b=>`<div class="item" onclick="openBoard(${b.board_id})">${esc(b.board)}</div>`).join('')||'<div class=due>Star a board with ☆</div>'],
recentb:['🕘 Recent boards',d=>d.recent_boards.map(b=>`<div class="item" onclick="openBoard(${b.board_id})">${esc(b.board)}</div>`).join('')||'<div class=due>Nothing yet</div>'],
focus:['🍅 Focus timer',()=>`<div id=pm style="font-size:34px;font-weight:600">25:00</div><div class=row><button onclick="pomo(25)">Focus 25</button><button onclick="pomo(5)">Break 5</button><button onclick="pomo(0)">Stop</button></div>`],milestones:['🏁 Milestones',d=>d.milestones.map(m=>`<div class="item" onclick="openBoard(${m.board_id})"><span>${esc(m.name)}</span><span class="due ${m.due<today()?'od':''}">${esc(m.due)} · ${esc(m.board)}</span></div>`).join('')||'<div class=due>No milestones</div>'],overdue:['⚠ Overdue',d=>li(d.overdue)],today:['📌 Due today',d=>li(d.today)],upcoming:['⏳ Upcoming',d=>li(d.upcoming)],recent:['🕑 Recently updated',d=>li(d.recent)],
progress:['📈 Project progress',d=>d.progress.map(p=>`<div class="item" onclick="openBoard(${p.board_id})"><span>${esc(p.board)}</span><span class=due>${p.done}/${p.total}</span></div><div class=bar><i style="width:${p.total?100*p.done/p.total:0}%"></i></div>`).join('')||'<div class=due>No boards</div>'],
inbox:['📥 Quick capture',d=>`<div class=row><input placeholder="Idea or task, Enter to save" onkeydown="if(event.key==='Enter')cap(this)"></div>`+d.inbox.map(i=>`<div class="item" data-inbox=${i.id} data-t="${esc(i.text)}"><span>${esc(i.text)}</span><button class=s onclick="delInbox(${i.id})">✕</button></div>`).join('')],
notes:['📝 Notes & ideas',()=>`<textarea rows=6 onblur="setSet('notes',this.value)">${esc(S.set.notes||'')}</textarea>`]};
async function home(){setView('home');const d=await run(inv('dashboard',{today:today()}));if(!d)return;
const empty=!S.ws?`<div class=box style="margin-bottom:12px"><b>Welcome!</b> Create a workspace, or <button class=p onclick="run(inv('seed')).then(()=>{S.ws=null;boot()})">add my starter workspaces</button></div>`:'';
$('view').innerHTML=`<div class=tb><b style="font-size:18px">Home</b><button onclick="custDash()">⚙ Customise</button></div>${empty}<div class=grid>${dash().filter(w=>w.on).map(w=>`<div class=box><h4 style="margin-top:0">${WT[w.id][0]}</h4>${WT[w.id][1](d)}</div>`).join('')}</div>`}
function custDash(){const a=dash();openDlg(`<b>Dashboard widgets</b>${a.map((w,i)=>`<div class=row><input type=checkbox style="flex:none" ${w.on?'checked':''} onchange="dashSet(${i},'on',this.checked)"><span style="flex:1">${WT[w.id][0]}</span><button onclick="dashSet(${i},'up')">↑</button><button onclick="dashSet(${i},'down')">↓</button></div>`).join('')}<div class=row><button class=p onclick="$('dlg').close()">Done</button></div>`)}
async function dashSet(i,k,v){const a=dash();if(k==='on')a[i].on=v;else{const j=k==='up'?i-1:i+1;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}await setSet('dash',JSON.stringify(a));custDash()}
async function cap(el){await run(inv('add_inbox',{text:el.value}));home()}
async function delInbox(id){await run(inv('del_inbox',{id}));home()}
async function remind(){const d=await run(inv('dashboard',{today:today()}));if(d)$('rem').textContent=(d.overdue.length||d.today.length)?`⏰ ${d.overdue.length} overdue · ${d.today.length} due today`:'';setTimeout(remind,600000)}
// ---------- board
async function openBoard(id){const d=await run(inv('board',{id}));if(!d)return;setView('board');run(inv('touch_board',{id}));S.board=id;S.data=d;paint()}
function vis(c){const f=S.f;if(f.q&&!(c.title+' '+c.description).toLowerCase().includes(f.q.toLowerCase()))return false;if(f.label&&!(c.labels||'').split(';').some(x=>x.split('|')[2]==f.label))return false;return !f.pri||c.priority>=f.pri}
const srt=a=>S.sort==='due'?[...a].sort((x,y)=>(x.due||'9')>(y.due||'9')?1:-1):S.sort==='pri'?[...a].sort((x,y)=>y.priority-x.priority):a;
const cardH=c=>{const L=(c.labels||'').split(';').filter(Boolean).map(x=>x.split('|'));return `<div class="card pri${c.priority} ${c.done?'dn':''}" data-c=${c.id} data-p=${c.pos} onclick="editCard(${c.id})">${L.length?`<div class=chips>${L.map(l=>`<span class=chip style="background:${esc(l[0])}">${esc(l[1])}</span>`).join('')}</div>`:''}${c.blocked?'🔒 ':''}${esc(c.title)}<div class=due>${c.due?`<span class="${!c.done&&c.due<today()?'od':''}">📅 ${esc(c.due)}</span> `:''}${c.recur?'🔁 ':''}${c.ck_total?`☑ ${c.ck_done}/${c.ck_total} `:''}${c.att?'📎'+c.att:''} ${c.timer?'⏱ running':c.spent?'⏱ '+fmtD(c.spent):''}</div></div>`};
function paint(){const d=S.data;$('view').style.background=d.board.bg;
$('view').innerHTML=`<div class=tb><b style="font-size:18px">${esc(d.board.name)}</b><input placeholder="Filter" value="${esc(S.f.q)}" oninput="S.f.q=this.value;paint2()" style="width:120px"><select onchange="S.f.label=this.value;paint()"><option value="">All labels</option>${d.labels.map(l=>`<option value=${l.id} ${S.f.label==l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select>
<select onchange="S.f.pri=+this.value;paint()">${['Any priority','Low+','Medium+','High'].map((n,i)=>`<option value=${i} ${S.f.pri==i?'selected':''}>${n}</option>`).join('')}</select>
<select onchange="S.sort=this.value;paint()">${[['manual','Manual order'],['due','Sort: due date'],['pri','Sort: priority']].map(o=>`<option value=${o[0]} ${S.sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><button onclick="labelsDlg()">🏷 Labels</button><button onclick="timeline()">🗓 Timeline</button><button onclick="msDlg()">🏁 Milestones</button><button onclick="filtersDlg()">🔖 Filters</button><button onclick="favBoard()">${d.board.fav?'⭐':'☆'}</button><button onclick="exportMd()">⬇ Markdown</button></div><div class=board id=bd2></div>`;paint2()}
function paint2(){const d=S.data;$('bd2').innerHTML=d.lists.map(l=>`<div class=list data-l=${l.id} data-p=${l.pos} style="${l.color?'border-top:3px solid '+esc(l.color):''}"><div class="item lh"><b ondblclick="renList(${l.id},'${esc(l.name).replace(/'/g,'')}')" title="Drag to reorder · double-click to rename">${esc(l.name)} <span class=due>${d.cards.filter(c=>c.list_id==l.id).length}</span></b><button class=s onclick="listMenu(${l.id})">⋯</button></div>
<div class=cards>${srt(d.cards.filter(c=>c.list_id==l.id&&vis(c))).map(cardH).join('')}</div><input class=addc placeholder="+ Add card" onkeydown="if(event.key==='Enter'&&this.value.trim())addCard(${l.id},this.value)"></div>`).join('')+`<div class=list><button onclick="addList()">+ Add list</button></div>`}
const re=()=>openBoard(S.board);
async function addCard(l,t){await run(inv('add_card',{list:l,title:t}));re()}
async function addList(){const n=await ask('List name');if(n){await run(inv('add_list',{board:S.board,name:n}));re()}}
async function renList(id,old){const n=await ask('Rename list',old);if(n){await run(inv('rename_list',{id,name:n}));re()}}
async function mvList(id,dir){await run(inv('move_list',{id,dir}));re()}
async function delList(id){if(confirm('Delete list and its cards?')){await run(inv('del_list',{id}));re()}}
async function labelsDlg(){const d=await run(inv('board',{id:S.board}));S.data=d;
openDlg(`<b>Labels</b>${d.labels.map(l=>`<div class=row><span class=chip style="background:${esc(l.color)}">${esc(l.name)}</span><span style="flex:1"></span><button onclick="run(inv('del_label',{id:${l.id}})).then(labelsDlg)">✕</button></div>`).join('')}<div class=row><input id=ln placeholder="New label"><input type=color id=lc value="#6c8cff" style="flex:none;padding:0;height:30px"><button class=p onclick="run(inv('add_label',{board:S.board,name:$('ln').value,color:$('lc').value})).then(labelsDlg)">Add</button></div><div class=row><button onclick="$('dlg').close()">Close</button></div>`,()=>re())}
async function tplDlg(list){const t=await run(inv('templates'))||[];
openDlg(`<b>Card templates</b>${t.map(x=>`<div class=row><span style="flex:1">${esc(x.name)}</span><button class=p onclick="run(inv('use_template',{id:${x.id},list:${list}})).then(()=>$('dlg').close())">Use</button><button onclick="run(inv('del_template',{id:${x.id}})).then(()=>tplDlg(${list}))">✕</button></div>`).join('')||'<div class=due>No templates yet. Open a card and choose "Save as template".</div>'}<div class=row><button onclick="$('dlg').close()">Close</button></div>`,()=>re())}
// ---------- card editor
async function saveCard(){if(S.skip||!$('et'))return;await run(inv('update_card',{id:S.card,title:$('et').value,description:$('ed').value,due:$('edu').value||null,start:$('est').value||null,priority:+$('ep').value,recur:$('er').value,fields:$('ef').value,est:+$('eest').value||0}))}
async function act(cmd,args){await saveCard();await run(inv(cmd,args));editCard(S.card)}
async function editCard(id){S.card=id;S.skip=false;const d=await run(inv('card_detail',{id}));if(!d)return;const c=d.card,on=new Set(d.labels.map(x=>x.label_id));
const o=(v,n)=>`<option value="${v}" ${c.recur===v||c.priority===v?'selected':''}>${n}</option>`;
openDlg(`<input id=et value="${esc(c.title)}" style="width:100%;font-size:16px"><div class=row><textarea id=ed rows=4 placeholder="Description">${esc(c.description)}</textarea></div>

function dragStart(e){const d=DR,r=d.el.getBoundingClientRect();d.on=true;S.noclick=true;d.ox=e.clientX-r.left;d.oy=e.clientY-r.top;

 document.body.appendChild(d.ghost);d.el.after(d.ph);d.el.style.display='none';document.body.style.userSelect='none'}

 const v=$('view'),vr=v.getBoundingClientRect();if(e.clientX>vr.right-50)v.scrollLeft+=18;else if(e.clientX<vr.left+50)v.scrollLeft-=18;
 if(d.kind==='card'){const L=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('list')&&x.dataset.l);if(!L)return;
  const box=L.querySelector('.cards');let before=null;for(const c of [...box.querySelectorAll('.card')].filter(c=>c!==d.el)){const r=c.getBoundingClientRect();if(e.clientY<r.top+r.height/2){before=c;break}}

 else{const bd=$('bd2');let before=null;for(const l of [...bd.querySelectorAll('.list[data-l]')].filter(l=>l!==d.el)){const r=l.getBoundingClientRect();if(e.clientX<r.left+r.width/2){before=l;break}}

 const prev=nb('previousElementSibling'),next=nb('nextElementSibling'),list=d.kind==='card'&&ph.closest('.list')?+ph.closest('.list').dataset.l:0;

function cardMenu(id){const c=S.view==='board'?(S.data.cards||[]).find(x=>x.id==id):null;const R=async(cmd,a)=>{await run(inv(cmd,a));refresh()};
 const dd=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv')};
 const it=[{t:'📂 Open',f:()=>editCard(id)},{t:c?(c.done?'↩ Reopen':'✓ Mark done'):'✓ Toggle done',f:()=>R('toggle_done',{id})},'-',
 {t:'⚑ Priority',sub:['None','Low','Medium','High'].map((n,i)=>({t:(c&&c.priority===i?'● ':'')+n,f:()=>R('set_priority',{id,priority:i})}))},
 {t:'📅 Due date',sub:[['Today',0],['Tomorrow',1],['In a week',7]].map(([n,k])=>({t:n,f:()=>R('set_due',{id,due:dd(k)})})).concat([{t:'Pick a date…',f:async()=>{const o=await formDlg('Due date',[['due','Date','date',(c&&c.due)||dd(0)]]);if(o&&o!=='del')await R('set_due',{id,due:o.due||null})}},{t:'Clear',f:()=>R('set_due',{id,due:null})}])}];
 if(c){const on=new Set((c.labels||'').split(';').filter(Boolean).map(x=>+x.split('|')[2])),sib=S.data.cards.filter(x=>x.list_id==c.list_id),mx=l=>Math.max(0,...S.data.cards.filter(x=>x.list_id==l).map(x=>x.pos));
  it.push({t:'🏷 Labels',sub:S.data.labels.map(l=>({t:(on.has(l.id)?'✔ ':'')+l.name,f:()=>R('toggle_label',{card:id,label:l.id})}))},
   {t:'➡ Move to list',sub:S.data.lists.filter(l=>l.id!=c.list_id).map(l=>({t:l.name,f:()=>R('move_card',{id,list:l.id,pos:mx(l.id)+1})}))},
   {t:'⤒ Move to top',f:()=>R('move_card',{id,list:c.list_id,pos:Math.min(...sib.map(x=>x.pos))-1})},{t:'⤓ Move to bottom',f:()=>R('move_card',{id,list:c.list_id,pos:mx(c.list_id)+1})},
   {t:c.timer?'⏹ Stop timer':'▶ Start timer',f:()=>R('timer_toggle',{id})},'-',{t:'⧉ Duplicate',f:()=>R('dup_card',{id})},
   {t:'⎘ Save as template',f:async()=>{const n=await ask('Template name',c.title);if(n){await run(inv('save_template',{card:id,name:n}));toast('Template saved')}}},
   {t:'📋 Copy title',f:()=>{navigator.clipboard.writeText(c.title);toast('Copied')}})}
 it.push('-',{t:'🗄 Archive',f:()=>R('archive_card',{id})},{t:'🗑 Delete',d:1,f:async()=>{if(confirm('Delete card?'))await R('del_card',{id})}});return it}
function listItems(id){const l=S.data.lists.find(x=>x.id==id),R=async(cmd,a)=>{await run(inv(cmd,a));re()};
 return [{t:'➕ Add card',f:()=>{const i=document.querySelector(`.list[data-l="${id}"] .addc`);if(i)i.focus()}},{t:'✎ Rename',f:()=>renList(id,l.name)},{t:'🎨 Colour',f:()=>listColor(id,l.color||'#6c8cff')},'-',
 {t:'◀ Move left',f:()=>R('move_list',{id,dir:-1})},{t:'▶ Move right',f:()=>R('move_list',{id,dir:1})},'-',{t:'⎘ Add from template',f:()=>tplDlg(id)},
 {t:'🗄 Archive done cards',f:()=>R('archive_cards',{list:id,doneOnly:true})},{t:'🗄 Archive all cards',f:async()=>{if(confirm('Archive all cards in this list?'))await R('archive_cards',{list:id,doneOnly:false})}},'-',{t:'🗑 Delete list',d:1,f:()=>delList(id)}]}
const boardItems=()=>[{t:'➕ Add list',f:addList},{t:'🏷 Labels',f:labelsDlg},{t:'🏁 Milestones',f:msDlg},{t:'🗓 Timeline',f:timeline},{t:'🔖 Saved filters',f:filtersDlg},'-',
 {t:S.data.board.fav?'☆ Remove favourite':'⭐ Favourite',f:favBoard},{t:'⬇ Export Markdown',f:exportMd},{t:'✎ Edit board',f:()=>editBoard(S.board)}];
function wsMenu(id){const w=S.wss.find(x=>x.id==id);return [{t:'📂 Open',f:()=>{S.ws=id;side().then(home)}},{t:'➕ New board here',f:async()=>{S.ws=id;await side();newBoard()}},{t:'✎ Edit workspace',f:()=>editWs(w.id,w.name,w.color,w.icon)},'-',
 {t:'🗑 Delete workspace',d:1,f:async()=>{if(confirm('Delete workspace with all boards and cards?')){await run(inv('del_workspace',{id}));S.ws=null;await side();home()}}}]}
function bdMenu(id){const b=S.boards.find(x=>x.id==id);return [{t:'📂 Open',f:()=>openBoard(id)},{t:b.fav?'☆ Remove favourite':'⭐ Favourite',f:async()=>{await run(inv('toggle_fav',{id}));await side();if(S.view==='board'&&S.board==id)re()}},
 {t:'⧉ Duplicate structure',f:()=>dupBoard(id)},{t:'✎ Edit board',f:()=>editBoard(id)},'-',{t:'🗑 Delete board',d:1,f:async()=>{if(confirm('Delete board and all its cards?')){await run(inv('del_board',{id}));await side();home()}}}]}
async function inboxMenu(pt,id,text){const ls=await run(inv('ws_lists',{ws:S.ws}))||[];
 showMenu(pt,[{t:'📌 Convert to card',sub:ls.map(l=>({t:`${l.board} › ${l.list}`,f:async()=>{await run(inv('add_card',{list:l.id,title:text}));await run(inv('del_inbox',{id}));home()}}))},{t:'🗑 Delete',d:1,f:()=>delInbox(id)}])}
addEventListener('contextmenu',e=>{const t=e.target;if(t.closest('input,textarea,select'))return;e.preventDefault();if($('dlg').open)return;
 const pt={clientX:e.clientX,clientY:e.clientY},c=t.closest('[data-c]'),inb=t.closest('[data-inbox]'),ws=t.closest('[data-ws]'),bd=t.closest('[data-bd]'),ls=t.closest('.list[data-l]');let it=null;
 if(c)it=cardMenu(+c.dataset.c);else if(inb){inboxMenu(pt,+inb.dataset.inbox,inb.dataset.t);return}
 else if(ws)it=wsMenu(+ws.dataset.ws);else if(bd)it=bdMenu(+bd.dataset.bd);
 else if(S.view==='board'&&ls)it=listItems(+ls.dataset.l);else if(S.view==='board'&&t.closest('#view'))it=boardItems();
 if(it)showMenu(pt,it);else hideMenu()});
function settingsView(){setView('settings');
$('view').innerHTML=`<div class=tb><b style="font-size:18px">⚙ Settings</b></div><div class=grid>
<div class=box><h4 style="margin-top:0">Appearance</h4><div class=row><button onclick="toggleTheme()">Toggle dark / light</button><label>Accent <input type=color value="${esc(S.set.accent||'#6c8cff')}" oninput="setAccent(this.value)" style="padding:0;height:30px;width:50px"></label></div></div>
<div class=box><h4 style="margin-top:0">Data</h4><div style="display:flex;flex-direction:column;gap:6px;max-width:320px">
<button onclick="doExport()">Export JSON</button><button onclick="$('imp').click()">Import JSON</button><button onclick="backupsDlg()">Backups / Restore</button><button onclick="syncDlg()">☁ Sync</button><button onclick="notifDlg()">🔔 Notifications</button>
<button onclick="run(inv('seed')).then(()=>{S.ws=null;boot()})">Add my starter workspaces</button><button onclick="run(inv('open_data_folder'))">Open data folder</button></div></div></div>`}
boot().then(autoSync);
</script></body></html>
