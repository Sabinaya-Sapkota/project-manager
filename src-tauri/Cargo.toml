[package]
name = "project-manager"
version = "0.1.0"
description = "Local-first project and task manager"
license = "MIT"
repository = "https://github.com/Sabinaya-Sapkota/project-manager"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
tauri-plugin-notification = "2"
serde_json = "1"
