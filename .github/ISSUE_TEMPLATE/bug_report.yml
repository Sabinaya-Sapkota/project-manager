name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a board\n2. ..."
  - type: input
    id: version
    attributes:
      label: App version
      description: Desktop app version, or "web demo"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
